[project]
name = "vod-devkit"
version = "0.4.4"
description = "VOD 插件包：MCP server + 技能 + 声明式护栏，供 AI agent/外部应用集成 VOD 分析能力"
requires-python = ">=3.10"
# 零第三方运行时依赖是红线（内网/离线装机）：默认 stdio 形态只用 stdlib。
# 远程面（--transport remote）需要官方 MCP SDK，按可选 extra 安装：
#   pip install 'vod-devkit[remote]'
dependencies = []

[project.optional-dependencies]
remote = ["mcp>=1.0"]

[project.scripts]
vod-devkit = "bin.vod-devkit"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
