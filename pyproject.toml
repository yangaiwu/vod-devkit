[project]
name = "vod-devkit"
version = "0.5.2"
description = "VOD 插件包：MCP server + 技能 + 声明式护栏，供 AI agent/外部应用集成 VOD 分析能力"
requires-python = ">=3.10"
# 零第三方运行时依赖是红线（内网/离线装机）：默认 stdio 形态只用 stdlib。
# 远程面（--transport remote）需要官方 MCP SDK，按可选 extra 安装：
#   pip install 'vod-devkit[remote]'
dependencies = []

[project.optional-dependencies]
remote = ["mcp>=1.0"]

[project.scripts]
vod-devkit = "bin.vod-devkit"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# 作用域刻意收窄（D-devtoolchain-7）：只对新增的纯逻辑模块做类型门禁。
# 存量 tools.py 是历史代码，全仓 mypy 会炸存量且无收益——新增模块必须过，
# 存量随重构自然收敛（mypy 的 files 白名单就是这条纪律的落点）。
python_version = "3.12"
files = ["vod_mcp/attribution.py"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
