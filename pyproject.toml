[project]
name = "vod-devkit"
version = "0.5.46"
description = "VOD 插件包：MCP server + 技能 + 声明式护栏，供 AI agent/外部应用集成 VOD 分析能力"
requires-python = ">=3.10"
# 零第三方运行时依赖是红线（内网/离线装机）：默认 stdio 形态只用 stdlib。
# 远程面（--transport remote）需要官方 MCP SDK，按可选 extra 安装：
#   pip install 'vod-devkit[remote]'
dependencies = []

[project.optional-dependencies]
remote = ["mcp>=1.0"]

[tool.setuptools]
# 标准 src-layout（D-structure-1 S3）：可导入包在 src/，项目级资产在 assets/（不进 wheel）
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
# 注意：此前写成 "bin.vod-devkit"（不是合法 entry-point，pip 装不动，实测
# ValueError: must be python-entrypoint-reference）。npx 入口仍是 bin/vod-devkit；
# pip 入口走包内 main。
vod-devkit = "vodkit_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# 作用域＝整包（D-devtoolchain-7 修订）：白名单的失败模式是静默——新增模块
# 忘加白名单就永远不被检查，门禁看着绿实际没覆盖。改为“整包默认检查 + 存量
# 显式豁免走下面的 overrides”：新模块不写任何配置也会被检，报错就修；
# 存量（2026-11-15 实测 25 errors / 10 files）作为技术债显式列出，只许缩不许长。
# tests/test_mypy_scope.py 锁住这两条性质（整包 + 豁免清单可解析且不漂移）。
python_version = "3.12"
files = ["src/vod_mcp", "src/vodkit_cli"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# 存量技术债清单（只许缩不许长；新增条目=一次显式决策，须同时改
# tests/test_mypy_scope.py 的 EXPECTED_LEGACY 并写明原因）
[[tool.mypy.overrides]]
module = [
  "vod_mcp.transport_remote",
  "vod_mcp.tools",
  "vod_mcp.payload",
  "vod_mcp.skills_registry",
  "vod_mcp.server",
  "vod_mcp.policy",
  "vod_mcp.host_adapters.codex",
  "vod_mcp.diagnose",
  "vod_mcp.detect_framework",
  "vod_mcp.config_forms",
]
ignore_errors = true
