name: vod-devkit CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

stages:
  test:
    name: pytest 质量门禁
    jobs:
      Test:
        name: pytest
        runs-on: [default]
        steps:
          - name: checkout
            uses: checkout-action@0.0.1
          - name: install deps
            run: python3 -m pip install pytest pyflakes
          - name: lint (pyflakes)
            run: cd repo_workspace 2>/dev/null || true; python3 -m pyflakes vod_mcp/*.py tests/*.py
          - name: run tests
            run: cd repo_workspace 2>/dev/null || true; python3 -m pytest tests/ -q
