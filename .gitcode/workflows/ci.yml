name: vod-devkit CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

stages:
  test:
    name: pytest 质量门禁
    jobs:
      Test:
        name: pytest
        runs-on: [ubuntu-latest, x64, small]
        steps:
          - name: checkout
            uses: checkout-action@0.0.1
          - name: install pytest
            run: python3 -m pip install pytest
          - name: run tests
            run: cd repo_workspace 2>/dev/null || true; python3 -m pytest tests/ -q
