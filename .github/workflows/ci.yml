name: vod-devkit CI

# ARCH-BLD-01（2026-11-19 走查）：门禁清单**只住在 scripts/gate_all.py**，
# 本文件与 .gitcode/workflows/ci.yml 都只调它 ⇒ 两份定义不再漂移
# （此前 GitHub 10 步 / GitCode 5 步，secret_scan/mypy/花名册/规则溯源/发版对账/
#  dsh 单测/宿主矩阵在 GitCode 侧全部缺席，而本仓实际托管在 GitCode）。
# 触发分支补 dev：开发主干是 dev，此前只在 main 触发 ⇒ dev 上的提交零 CI 门禁。
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发版状态对账要读 tag（浅克隆看不到 tag → 曾把已发版判成 DRIFT）
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（含远程面可选 extra，否则远程面用例 SKIP）
        run: python3 -m pip install pytest pyflakes mypy pyyaml 'mcp>=1.0'
      - name: 全量门禁（清单见 scripts/gate_all.py）
        # 不含 hostmatrix：它需要宿主 CLI，单独一个 job 跑（见下），
        # 在无 CLI 的 runner 上逐项 SKIP 也不该拖慢主门禁。
        run: python3 scripts/gate_all.py lint copies secret roster rules mypy registry tests dsh packaging

  host-matrix:
    # 宿主安装矩阵（E2E）：隔离 HOME 里 装 → 断言配置形态 → 拉起 server 自证 → 卸 → 验干净。
    # runner 上没有 codex/dsh/hermes 等宿主 CLI 的项记 SKIP（不算失败）；自托管 runner
    # 装了 CLI 时全量跑。这条门禁的意义：新加宿主时"配置写对了、卸载没带走用户东西"
    # 不再靠人肉冒烟。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建信息（矩阵用它断言探针版本）
        run: PYTHONPATH=src python3 bin/vod-devkit build-info
      - name: 宿主矩阵
        run: python3 scripts/gate_all.py hostmatrix