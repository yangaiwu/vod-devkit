name: vod-devkit CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发版状态对账要读 tag（浅克隆看不到 tag → 曾把已发版判成 DRIFT）；
          # 脚本侧另有浅克隆兜底，这里取全量历史让门禁权威。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（含远程面可选 extra，否则远程面用例 SKIP）
        run: python3 -m pip install pytest pyflakes mypy pyyaml 'mcp>=1.0' 
      - name: lint（pyflakes，递归——子目录模块漏检=门禁形同虚设）
        run: python3 -m pyflakes vod_mcp tests
      - name: 双副本一致性（内容一致 + 同步结果已提交；单一入口）
        run: python3 scripts/verify_copies.py
      - name: 凭据/高危模式扫描（与 pre-push 同一把尺）
        run: python3 scripts/secret_scan.py
      - name: 用例花名册对账（docs ↔ tests/case_roster.json）
        run: python3 scripts/sync_case_roster.py --check
      - name: 规则技能 ↔ 引擎真源对账（无引擎检出时 SKIP，不判绿）
        run: python3 scripts/rules_provenance.py
      - name: 类型门禁（作用域=新增纯逻辑模块，见 pyproject [tool.mypy]）
        run: python3 -m mypy
      - name: 发版状态对账（registry↔仓内；仓内领先=开发中，不判红）
        run: python3 scripts/registry_reconcile.py
      - name: 测试（pytest 全量：单元+护栏+packs+协议级+回环+meta+账本）
        run: python3 -m pytest tests/ -q
      - name: 安装器烟雾
        run: |
          python3 bin/vod-devkit build-info
          python3 -c "import ast; ast.parse(open('bin/vod-devkit').read()); print('bin 语法 OK')"

  host-matrix:
    # 宿主安装矩阵（E2E）：隔离 HOME 里 装 → 断言配置形态 → 拉起 server 自证 → 卸 → 验干净。
    # runner 上没有 codex/dsh/hermes 等宿主 CLI 的项记 SKIP（不算失败）；自托管 runner
    # 装了 CLI 时全量跑。这条门禁的意义：新加宿主时"配置写对了、卸载没带走用户东西"
    # 不再靠人肉冒烟。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建信息（矩阵用它断言探针版本）
        run: python3 bin/vod-devkit build-info
      - name: 宿主矩阵
        run: python3 scripts/host_matrix.py
