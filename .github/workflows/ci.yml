name: vod-devkit CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（含远程面可选 extra，否则远程面用例 SKIP）
        run: python3 -m pip install pytest pyflakes mypy pyyaml 'mcp>=1.0' 
      - name: lint（pyflakes）
        run: python3 -m pyflakes vod_mcp/*.py tests/*.py
      - name: 双副本一致性（vod_mcp + skills 同步锁）
        run: >-
          diff -r -x 'runtime.json' -x '__pycache__' -x '*.log' vod_mcp plugins/vod-devkit/vod_mcp
          && diff -r -x '__pycache__' skills plugins/vod-devkit/skills
          || { echo "FAIL: 双副本漂移——先跑 scripts/sync_plugin.py 再提交"; exit 1; }
      - name: 凭据/高危模式扫描（与 pre-push 同一把尺）
        run: python3 scripts/secret_scan.py
      - name: 用例花名册对账（docs ↔ tests/case_roster.json）
        run: python3 scripts/sync_case_roster.py --check
      - name: 规则技能 ↔ 引擎真源对账（无引擎检出时 SKIP，不判绿）
        run: python3 scripts/rules_provenance.py
      - name: 类型门禁（作用域=新增纯逻辑模块，见 pyproject [tool.mypy]）
        run: python3 -m mypy
      - name: 发版状态对账（registry↔仓内；仓内领先=开发中，不判红）
        run: python3 scripts/registry_reconcile.py
      - name: 测试（pytest 全量：单元+护栏+packs+协议级+回环+meta+账本）
        run: python3 -m pytest tests/ -q
      - name: 安装器烟雾
        run: |
          python3 bin/vod-devkit build-info
          python3 -c "import ast; ast.parse(open('bin/vod-devkit').read()); print('bin 语法 OK')"
